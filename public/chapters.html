<!doctype html>
<html lang="id" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Daftar Chapter - comicshyt</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          surface: "#131315",
          "surface-dim": "#131315",
          "surface-bright": "#39393b",
          "surface-container-lowest": "#0e0e10",
          "surface-container-low": "#1b1b1d",
          "surface-container": "#201f21",
          "surface-container-high": "#2a2a2c",
          "surface-container-highest": "#353437",
          "on-surface": "#e5e1e4",
          "on-surface-variant": "#e6bdbb",
          outline: "#ad8887",
          "outline-variant": "#5d3f3f",
          primary: "#ffb3b2",
          "primary-container": "#ff525d",
          secondary: "#b4c5ff",
          background: "#131315"
        },
        fontFamily: {
          sans: ["Plus Jakarta Sans", "sans-serif"]
        }
      }
    }
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="bg-background text-on-surface font-sans antialiased min-h-screen flex flex-col">
  <!-- Top Navigation Header -->
  <header class="bg-surface-container-low sticky top-0 z-50 border-b border-outline-variant">
    <div class="max-w-[1000px] mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/library" class="flex items-center gap-2 text-on-surface-variant hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        <span class="font-semibold text-sm">Kembali ke Perpustakaan</span>
      </a>
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded bg-primary-container flex items-center justify-center text-white text-xs font-bold">C</span>
        <span class="font-bold tracking-tight">comicshyt</span>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[1000px] w-full mx-auto px-4 py-6">
    <div id="info"></div>
    <div id="status" class="py-8 text-center text-on-surface-variant">Memuat detail komik…</div>

    <div id="list-area" class="mt-8 space-y-4" hidden>
      <!-- Reading Progress Bar -->
      <div id="read-progress-section" class="bg-surface-container-low rounded-2xl border border-outline-variant p-4 sm:p-5" hidden>
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-[20px] text-emerald-400" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
            <span class="text-sm font-bold text-on-surface">Progress Bacaan</span>
          </div>
          <span id="read-progress-text" class="text-xs font-semibold text-on-surface-variant"></span>
        </div>
        <div class="w-full bg-surface-container-highest rounded-full h-2 overflow-hidden">
          <div id="read-progress-bar" class="h-full rounded-full bg-gradient-to-r from-emerald-500 to-emerald-400 transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
        <div class="flex items-center justify-between mt-2 text-[11px] text-outline">
          <span id="read-count-label">0 chapter dibaca</span>
          <span id="read-percent-label">0%</span>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pb-3 border-b border-outline-variant">
        <h2 class="text-lg font-bold text-on-surface flex items-center gap-2 self-start sm:self-auto">
          <span class="material-symbols-outlined text-primary-container">format_list_bulleted</span>
          <span>Daftar Chapter</span>
          <span id="chapter-count" class="text-xs px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant border border-outline-variant"></span>
        </h2>
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <div class="relative flex-1 sm:w-60">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline pointer-events-none">
              <span class="material-symbols-outlined text-[18px]">search</span>
            </span>
            <input id="q" type="search" inputmode="numeric" placeholder="Cari nomor chapter…" 
                   class="w-full pl-9 pr-3 py-1.5 bg-surface-container border border-outline-variant rounded-xl text-sm text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container transition-colors">
          </div>
          <button id="sort" class="px-3 py-1.5 bg-surface-container border border-outline-variant hover:bg-surface-container-high rounded-xl text-sm font-medium transition-colors flex items-center gap-1.5 whitespace-nowrap">
            <span class="material-symbols-outlined text-[16px]">swap_vert</span>
            <span id="sort-text">Terbaru</span>
          </button>
        </div>
      </div>

      <!-- Filter tabs: Semua / Sudah Dibaca / Belum Dibaca -->
      <div id="read-filter-tabs" class="flex items-center gap-1.5 overflow-x-auto pb-1" hidden>
        <button data-filter="all" class="read-filter-btn px-3 py-1.5 rounded-lg bg-primary-container text-white text-xs font-semibold transition-all shadow-sm">Semua</button>
        <button data-filter="read" class="read-filter-btn px-3 py-1.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface-variant text-xs transition-colors border border-outline-variant hover:text-on-surface flex items-center gap-1">
          <span class="material-symbols-outlined text-[14px] text-emerald-400" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          Sudah Dibaca
        </button>
        <button data-filter="unread" class="read-filter-btn px-3 py-1.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface-variant text-xs transition-colors border border-outline-variant hover:text-on-surface flex items-center gap-1">
          <span class="material-symbols-outlined text-[14px] text-outline">radio_button_unchecked</span>
          Belum Dibaca
        </button>
      </div>

      <ul id="list" class="divide-y divide-outline-variant/60 bg-surface-container-low rounded-xl border border-outline-variant overflow-hidden"></ul>
    </div>
  </main>

<script>
const params  = new URLSearchParams(location.search);
const mangaId = params.get('manga');
const $ = (s) => document.querySelector(s);

let chapters = [];
let newestFirst = true;
let lastRead = null;
let readHistory = {};
let readFilter = 'all'; // 'all' | 'read' | 'unread'

const readerUrl = (c) => `/reader?id=${c.chapter_id}&manga=${mangaId}`;
const fmtDate = (s) => s ? new Date(s).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) : '';

function renderInfo(m) {
  document.title = `${m.title} - comicshyt`;
  const genres = (m.taxonomy?.Genre || []).map(g => g.name).join(', ');
  const author = (m.taxonomy?.Author || []).map(a => a.name).join(', ');
  const cover = m.cover_portrait_url || m.cover_image_url || '';
  const updated = m.updated_at || m.updatedAt || m.last_update || m.updated_date || m.release_date;

  const info = $('#info');
  info.innerHTML = `
    <div class="flex flex-col md:flex-row gap-6 p-5 sm:p-6 bg-surface-container-low rounded-2xl border border-outline-variant">
      <div class="w-36 sm:w-44 aspect-[3/4] rounded-xl overflow-hidden border border-outline-variant flex-shrink-0 bg-surface-container mx-auto md:mx-0">
        ${cover ? `<img src="${cover}" alt="${m.title}" class="w-full h-full object-cover" referrerpolicy="no-referrer">` : `<div class="w-full h-full flex items-center justify-center text-outline"><span class="material-symbols-outlined text-4xl">menu_book</span></div>`}
      </div>
      <div class="flex-1 flex flex-col justify-between">
        <div>
          <div class="flex items-center gap-2 flex-wrap mb-2">
            <span class="px-2 py-0.5 rounded text-[11px] font-bold uppercase bg-primary-container/20 text-primary border border-primary-container/30">${m.taxonomy?.Format?.[0]?.name || 'KOMIK'}</span>
            <span class="text-xs text-on-surface-variant flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> ${m.status ? 'Ongoing' : 'Update'}
            </span>
            ${m.bookmark_count ? `<span class="text-xs text-outline flex items-center gap-1 ml-auto"><span class="material-symbols-outlined text-[14px]">bookmark</span>${m.bookmark_count}</span>` : ''}
          </div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-on-surface mb-2">${m.title}</h1>
          <p class="text-xs text-on-surface-variant font-medium mb-3">${[author, genres].filter(Boolean).join(' • ')}${updated ? ` · Diperbarui ${fmtDate(updated)}` : ''}</p>
          <p class="text-sm text-on-surface-variant leading-relaxed whitespace-pre-line mb-4">${esc(m.description || 'Tidak ada deskripsi.')}</p>
        </div>
        <div id="action-btn-container" class="pt-4 border-t border-outline-variant/60 flex items-center gap-3"></div>
      </div>
    </div>
  `;
}

function renderActions() {
  const container = $('#action-btn-container');
  if (!container || !chapters.length) return;
  const oldest = chapters[chapters.length - 1];

  const marked = getBookmarks()[mangaId];
  const bookmarkButton = `<button type="button" id="bookmark-btn" class="px-4 py-2.5 rounded-xl font-medium text-sm transition-colors border border-outline-variant ${marked ? 'bg-primary-container text-white' : 'bg-surface-container hover:bg-surface-container-high text-on-surface'}">
    <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' ${marked ? 1 : 0};">bookmark</span>
    ${marked ? 'Ditandai' : 'Tandai Komik'}
  </button>`;

  if (lastRead) {
    container.innerHTML = `
      <a href="/reader?id=${lastRead.chapterId}&manga=${mangaId}" class="px-5 py-2.5 bg-primary-container hover:bg-opacity-90 text-white rounded-xl font-semibold text-sm transition-colors flex items-center gap-2 shadow-sm">
        <span class="material-symbols-outlined text-[18px]">play_arrow</span>
        <span>Lanjut Baca Ch. ${lastRead.number}</span>
      </a>
      <a href="${readerUrl(oldest)}" class="px-4 py-2.5 bg-surface-container hover:bg-surface-container-high text-on-surface rounded-xl font-medium text-sm transition-colors border border-outline-variant">
        Mulai dari Ch. ${oldest.chapter_number}
      </a>
      ${bookmarkButton}
    `;
  } else {
    container.innerHTML = `
      <a href="${readerUrl(oldest)}" class="px-5 py-2.5 bg-primary-container hover:bg-opacity-90 text-white rounded-xl font-semibold text-sm transition-colors flex items-center gap-2 shadow-sm">
        <span class="material-symbols-outlined text-[18px]">menu_book</span>
        <span>Mulai Baca Ch. ${oldest.chapter_number}</span>
      </a>
      ${bookmarkButton}
    `;
  }
  $('#bookmark-btn').addEventListener('click', toggleBookmark);
}

function getBookmarks() {
  try { return JSON.parse(localStorage.getItem('bookmarks') || '{}'); } catch { return {}; }
}

function toggleBookmark() {
  const bookmarks = getBookmarks();
  if (bookmarks[mangaId]) delete bookmarks[mangaId];
  else bookmarks[mangaId] = { at: Date.now() };
  localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
  renderActions();
}

function renderReadProgress() {
  const total = chapters.length;
  const readCount = chapters.filter(c => readHistory[c.chapter_id]).length;
  const pct = total > 0 ? Math.round((readCount / total) * 100) : 0;

  const section = $('#read-progress-section');
  const filterTabs = $('#read-filter-tabs');

  if (readCount > 0) {
    section.hidden = false;
    filterTabs.hidden = false;
    $('#read-progress-bar').style.width = `${pct}%`;
    $('#read-progress-text').textContent = `${readCount} / ${total} chapter`;
    $('#read-count-label').textContent = `${readCount} chapter dibaca`;
    $('#read-percent-label').textContent = `${pct}%`;
  } else {
    section.hidden = true;
    filterTabs.hidden = true;
  }
}

function renderList() {
  const term = $('#q').value.trim();
  let rows = newestFirst ? chapters : [...chapters].reverse();
  if (term) rows = rows.filter(c => String(c.chapter_number).includes(term));

  // Filter berdasarkan status baca
  if (readFilter === 'read') {
    rows = rows.filter(c => readHistory[c.chapter_id]);
  } else if (readFilter === 'unread') {
    rows = rows.filter(c => !readHistory[c.chapter_id]);
  }

  const ul = $('#list');
  ul.replaceChildren();
  const frag = document.createDocumentFragment();

  for (const c of rows) {
    const isCurrent = lastRead && lastRead.chapterId === c.chapter_id;
    const isRead = !!readHistory[c.chapter_id];
    const li = document.createElement('li');
    li.className = `transition-colors hover:bg-surface-container ${isCurrent ? 'bg-primary-container/10 border-l-4 border-primary-container' : ''}`;

    const a = document.createElement('a');
    a.href = readerUrl(c);
    a.className = 'flex items-center justify-between px-4 py-3 text-sm text-inherit';

    const left = document.createElement('div');
    left.className = 'flex items-center gap-2 min-w-0';

    // Icon: bookmark untuk current, check untuk sudah dibaca, circle untuk belum
    if (isCurrent) {
      left.innerHTML = `<span class="material-symbols-outlined text-primary text-[18px]">bookmark</span>`;
    } else if (isRead) {
      left.innerHTML = `<span class="material-symbols-outlined text-emerald-400 text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>`;
    } else {
      left.innerHTML = `<span class="material-symbols-outlined text-outline/40 text-[18px]">radio_button_unchecked</span>`;
    }

    const titleSpan = document.createElement('span');
    titleSpan.className = `font-semibold truncate ${isCurrent ? 'text-primary' : isRead ? 'text-on-surface-variant/60' : 'text-on-surface'}`;
    titleSpan.textContent = `Chapter ${c.chapter_number}${c.chapter_title ? ` — ${c.chapter_title}` : ''}`;
    left.appendChild(titleSpan);

    const right = document.createElement('div');
    right.className = 'flex items-center gap-2 flex-shrink-0 ml-3';

    if (isRead && !isCurrent) {
      const badge = document.createElement('span');
      badge.className = 'hidden sm:inline-flex px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
      badge.textContent = 'Dibaca';
      right.appendChild(badge);
    }

    const dateSpan = document.createElement('span');
    dateSpan.className = `text-xs flex-shrink-0 ${isRead ? 'text-outline/50' : 'text-outline'}`;
    dateSpan.textContent = fmtDate(c.release_date);
    right.appendChild(dateSpan);

    a.append(left, right);
    li.appendChild(a);
    frag.appendChild(li);
  }

  ul.appendChild(frag);

  if (!rows.length) {
    const emptyLi = document.createElement('li');
    emptyLi.className = 'py-6 text-center text-sm text-outline';
    emptyLi.textContent = readFilter === 'read' ? 'Belum ada chapter yang dibaca.' : readFilter === 'unread' ? 'Semua chapter sudah dibaca! 🎉' : 'Tidak ada chapter yang cocok.';
    ul.appendChild(emptyLi);
  }
}

async function main() {
  const status = $('#status');
  if (!mangaId) {
    status.textContent = 'Parameter ?manga= tidak ditemukan di URL.';
    status.className = 'py-8 text-center text-red-400';
    return;
  }
  try {
    lastRead = (JSON.parse(localStorage.getItem('progress') || '{}'))[mangaId] || null;
  } catch { lastRead = null; }
  try {
    readHistory = (JSON.parse(localStorage.getItem('readHistory') || '{}'))[mangaId] || {};
  } catch { readHistory = {}; }

  try {
    const [mRes, cRes] = await Promise.all([
      fetch(`/api/manga/${mangaId}`),
      fetch(`/api/manga/${mangaId}/chapters`)
    ]);
    if (!mRes.ok || !cRes.ok) throw new Error(`HTTP ${!mRes.ok ? mRes.status : cRes.status}`);
    const m = await mRes.json();
    const c = await cRes.json();

    renderInfo(m.data ?? m);
    chapters = c.data;
    $('#chapter-count').textContent = `${chapters.length} chapter`;
    renderActions();
    renderReadProgress();

    status.hidden = true;
    $('#list-area').hidden = false;
    renderList();
  } catch (e) {
    status.textContent = `Gagal memuat: ${e.message}`;
    status.className = 'py-8 text-center text-red-400';
  }
}

$('#q').addEventListener('input', renderList);
$('#sort').addEventListener('click', () => {
  newestFirst = !newestFirst;
  $('#sort-text').textContent = newestFirst ? 'Terbaru' : 'Terlama';
  renderList();
});

// Filter tabs: Semua / Sudah Dibaca / Belum Dibaca
document.querySelectorAll('.read-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    readFilter = btn.dataset.filter;
    document.querySelectorAll('.read-filter-btn').forEach(b => {
      b.className = b === btn
        ? 'read-filter-btn px-3 py-1.5 rounded-lg bg-primary-container text-white text-xs font-semibold transition-all shadow-sm'
        : 'read-filter-btn px-3 py-1.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface-variant text-xs transition-colors border border-outline-variant hover:text-on-surface flex items-center gap-1';
    });
    renderList();
  });
});

main();
</script>
</body>
</html>
